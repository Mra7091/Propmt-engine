<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PM Prompt Engine</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PMEngine">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Tailwind CSS & Vazirmatn -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Vazirmatn', 'system-ui', 'sans-serif'],
            mono: ['Consolas', 'Courier New', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: 'Vazirmatn', sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .ltr-box { direction: ltr !important; text-align: left !important; }
    .prose table { width: 100%; border-collapse: collapse; margin: 0.5rem 0; font-size: 0.8rem; }
    .prose th, .prose td { border: 1px solid #334155; padding: 6px 10px; }
    .prose th { background-color: #1e293b; color: #38bdf8; }
    .prose ul { list-style-type: disc; padding-right: 1.25rem; margin: 0.5rem 0; }
    .prose ol { list-style-type: decimal; padding-right: 1.25rem; margin: 0.5rem 0; }
    .prose h1, .prose h2, .prose h3 { color: #f8fafc; font-weight: 700; margin-top: 0.75rem; margin-bottom: 0.25rem; }
    .prose p { margin-bottom: 0.5rem; line-height: 1.6; }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden select-none">

  <!-- Minimal Header -->
  <header class="h-14 border-b border-slate-800/80 bg-slate-900/60 backdrop-blur px-4 sm:px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-sm shadow-sm">
        ⚡
      </div>
      <div>
        <h1 class="font-bold text-xs sm:text-sm tracking-wide text-slate-200">PM Prompt Engine</h1>
        <div class="text-[10px] text-slate-400 font-mono hidden sm:block">Gemini Brain ➔ Claude Prompt</div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="clearChatHistory()" class="text-xs text-slate-400 hover:text-rose-400 px-2 py-1 transition" title="پاک کردن چت">
        پاکسازی چت
      </button>
      <button onclick="openSettingsModal()" class="px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700/80 text-xs font-medium text-slate-200 flex items-center gap-1.5 transition">
        <span>⚙️ تنظیمات</span>
      </button>
    </div>
  </header>

  <!-- Chat Messages Stream -->
  <main id="chatContainer" class="flex-1 overflow-y-auto px-3 sm:px-6 py-4 sm:py-6 space-y-4 sm:space-y-6 max-w-4xl mx-auto w-full select-text">
    
    <!-- Empty state -->
    <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center p-6 space-y-3 opacity-60">
      <div class="text-3xl">💡</div>
      <h3 class="text-sm sm:text-base font-bold text-slate-300">نیازمندی یا تسک محصولی خود را بنویسید</h3>
      <p class="text-xs text-slate-400 max-w-xs sm:max-w-sm leading-relaxed">
        جمینای تسک‌ها و معیارهای پذیرش را تحلیل می‌کند و یک پرامپت انگلیسی آماده برای کپی به Claude به شما می‌دهد.
      </p>
    </div>

  </main>

  <!-- Input Bar -->
  <footer class="border-t border-slate-800/80 bg-slate-900/80 backdrop-blur p-3 sm:p-4 shrink-0">
    <div class="max-w-4xl mx-auto">
      <div class="flex items-end gap-2 bg-slate-950 border border-slate-800 rounded-2xl p-1.5 sm:p-2 focus-within:border-emerald-500/80 focus-within:ring-1 focus-within:ring-emerald-500/40 transition">
        <textarea
          id="userInput"
          rows="1"
          placeholder="تسک یا نیازمندی محصولی خود را بنویسید..."
          class="w-full bg-transparent resize-none border-0 focus:outline-none text-slate-100 placeholder-slate-500 text-xs sm:text-sm p-2 max-h-32 sm:max-h-36 leading-relaxed"
          onkeydown="handleKeyDown(event)"
          oninput="autoGrow(this)"
        ></textarea>

        <button
          id="sendBtn"
          onclick="sendMessage()"
          class="px-3.5 sm:px-4 py-2 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs font-bold rounded-xl transition flex items-center gap-1 shrink-0 disabled:opacity-40"
        >
          <span>ارسال</span>
          <svg class="w-3.5 h-3.5 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-5 sm:p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="font-bold text-sm text-slate-200">⚙️ تنظیمات API</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-200 p-1">✕</button>
      </div>

      <div class="space-y-3.5 text-xs">
        <div>
          <label class="font-bold text-emerald-400 block mb-1">کلید Google Gemini API Key (رایگان):</label>
          <input
            type="password"
            id="cfgGeminiKey"
            placeholder="AIzaSy..."
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 font-mono text-xs focus:border-emerald-500 focus:outline-none"
          />
          <p class="text-[11px] text-slate-400 mt-1">کلید در مرورگر/گوشی شما ذخیره می‌شود. دریافت رایگان از <a href="https://aistudio.google.com/apikey" target="_blank" class="text-emerald-400 underline">Google AI Studio</a>.</p>
        </div>

        <div>
          <label class="font-bold text-slate-300 block mb-1">کلید Anthropic API Key (اختیاری - برای ارسال مستقیم):</label>
          <input
            type="password"
            id="cfgAnthropicKey"
            placeholder="sk-ant-..."
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 font-mono text-xs focus:border-emerald-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="font-bold text-slate-300 block mb-1">مدل Claude:</label>
          <select id="cfgClaudeModel" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 text-xs focus:border-emerald-500 focus:outline-none">
            <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
            <option value="claude-3-7-sonnet-latest">Claude 3.7 Sonnet</option>
            <option value="claude-3-5-haiku-20241022">Claude 3.5 Haiku</option>
          </select>
        </div>
      </div>

      <div class="pt-2 flex justify-end gap-2 border-t border-slate-800">
        <button onclick="closeSettingsModal()" class="px-3 py-1.5 text-xs text-slate-400 hover:text-slate-200">انصراف</button>
        <button onclick="saveSettings()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-md transition">
          ذخیره
        </button>
      </div>
    </div>
  </div>

  <script>
    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }

    marked.setOptions({ breaks: true, gfm: true });

    const GEMINI_SYSTEM_PROMPT = `نقش تو: تو یک مدیر محصول ارشد (Senior Product Manager & Prompt Architect) هستی.
کاربر به زبان فارسی دغدغه‌ها، ایده‌ها، تسک‌ها و نیازمندی‌های محصولش را برایت می‌نویسد.

وظیفه تو در هر پاسخ شامل ۲ بخش اجباری است:

بخش اول (به زبان فارسی):
- تحلیل حرفه‌ای، شفاف و ساختاریافته‌ی نیازمندی (شامل User Story، معیارهای پذیرش به سبک Given-When-Then، اولویت‌بندی، چالش‌ها و نکات فنی).
- پاسخ کوتاه، روان و کاربردی بدون تعارفات اضافی.

بخش دوم (پرامپت نهایی برای کلود - به زبان انگلیسی):
- پرامپت انگلیسی فوق‌العاده دقیق، مهندسی‌شده و متراکم (Token-optimized) که کاربر بتواند بدون هیچ تغییری مستقیماً به Claude یا Claude Code تحویل دهد تا کار را انجام دهد.
- این پرامپت باید دقیقاً داخل تگ‌های زیر قرار بگیرد:
<<<CLAUDE_PROMPT>>>
[اینجا پرامپت انگلیسی بسیار فشرده و حرفه‌ای برای کلود نوشته شود]
<<<END_CLAUDE_PROMPT>>>
`;

    const CANDIDATE_MODELS = [
      "gemini-3.1-flash-lite",
      "gemini-3.5-flash",
      "gemini-3.8-flash",
      "gemini-flash-latest"
    ];

    document.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      renderStoredHistory();
    });

    function autoGrow(element) {
      element.style.height = 'auto';
      element.style.height = (element.scrollHeight) + 'px';
    }

    // Settings in LocalStorage
    function loadSettings() {
      const geminiKey = localStorage.getItem('pm_gemini_key') || '';
      const anthropicKey = localStorage.getItem('pm_anthropic_key') || '';
      const claudeModel = localStorage.getItem('pm_claude_model') || 'claude-3-5-sonnet-20241022';

      document.getElementById('cfgGeminiKey').value = geminiKey;
      document.getElementById('cfgAnthropicKey').value = anthropicKey;
      document.getElementById('cfgClaudeModel').value = claudeModel;

      if (!geminiKey) {
        setTimeout(openSettingsModal, 400);
      }
    }

    function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }

    function saveSettings() {
      const geminiKey = document.getElementById('cfgGeminiKey').value.trim();
      const anthropicKey = document.getElementById('cfgAnthropicKey').value.trim();
      const claudeModel = document.getElementById('cfgClaudeModel').value;

      localStorage.setItem('pm_gemini_key', geminiKey);
      localStorage.setItem('pm_anthropic_key', anthropicKey);
      localStorage.setItem('pm_claude_model', claudeModel);

      closeSettingsModal();
    }

    // Chat History in LocalStorage
    function getStoredHistory() {
      try {
        return JSON.parse(localStorage.getItem('pm_chat_history') || '[]');
      } catch (e) {
        return [];
      }
    }

    function appendToHistory(turn) {
      const history = getStoredHistory();
      history.push(turn);
      localStorage.setItem('pm_chat_history', JSON.stringify(history.slice(-30)));
    }

    function renderStoredHistory() {
      const history = getStoredHistory();
      if (history && history.length > 0) {
        document.getElementById('emptyState')?.classList.add('hidden');
        history.forEach(item => {
          renderUserMessage(item.user);
          renderAssistantTurn(item.id, item.gemini, item.claude_prompt, item.claude_response);
        });
      }
    }

    function clearChatHistory() {
      if (!confirm('آیا تاریخچه گفتگو در این دستگاه پاک شود؟')) return;
      localStorage.removeItem('pm_chat_history');
      const container = document.getElementById('chatContainer');
      container.innerHTML = `
        <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center p-6 space-y-3 opacity-60">
          <div class="text-3xl">💡</div>
          <h3 class="text-sm sm:text-base font-bold text-slate-300">نیازمندی یا تسک محصولی خود را بنویسید</h3>
          <p class="text-xs text-slate-400 max-w-xs sm:max-w-sm leading-relaxed">
            جمینای تسک‌ها و معیارهای پذیرش را تحلیل می‌کند و یک پرامپت انگلیسی آماده برای کپی به Claude به شما می‌دهد.
          </p>
        </div>
      `;
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    // Main API Call (100% Client-side Direct to Google Gemini)
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const geminiKey = localStorage.getItem('pm_gemini_key') || '';
      if (!geminiKey) {
        alert('لطفاً ابتدا از بخش تنظیمات ⚙️ کلید Gemini API Key خود را وارد کنید.');
        openSettingsModal();
        return;
      }

      const sendBtn = document.getElementById('sendBtn');
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      document.getElementById('emptyState')?.classList.add('hidden');
      renderUserMessage(text);

      const loadingId = renderLoading();

      try {
        const history = getStoredHistory();
        const geminiHistory = [];
        history.slice(-6).forEach(h => {
          if (h.user) geminiHistory.push({ role: "user", parts: [{ text: h.user }] });
          if (h.gemini) geminiHistory.push({ role: "model", parts: [{ text: h.gemini }] });
        });

        const contents = [
          { role: "user", parts: [{ text: GEMINI_SYSTEM_PROMPT }] },
          { role: "model", parts: [{ text: "متوجه شدم. من به عنوان مدیر محصول ارشد تحلیل فارسی و پرامپت متراکم انگلیسی را در تگ <<<CLAUDE_PROMPT>>> ارائه می‌دهم." }] },
          ...geminiHistory,
          { role: "user", parts: [{ text: text }] }
        ];

        let result = null;
        let lastError = "";

        // Try models sequentially
        for (const model of CANDIDATE_MODELS) {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${geminiKey}`;
          try {
            const resp = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: contents,
                generationConfig: {
                  temperature: 0.3,
                  maxOutputTokens: 2500
                }
              })
            });

            if (resp.ok) {
              const data = await resp.json();
              const candidates = data.candidates || [];
              if (candidates.length > 0) {
                const parts = candidates[0].content?.parts || [];
                const fullText = parts.map(p => p.text || '').join('').trim();
                
                const pattern = /<<<CLAUDE_PROMPT>>>\s*([\s\S]*?)\s*<<<END_CLAUDE_PROMPT>>>/;
                const match = fullText.match(pattern);
                let claudePrompt = "";
                let cleanGeminiText = fullText;

                if (match) {
                  claudePrompt = match[1].trim();
                  cleanGeminiText = fullText.replace(pattern, '').trim();
                }

                result = {
                  geminiText: cleanGeminiText,
                  claudePrompt: claudePrompt
                };
                break;
              }
            } else {
              const errJson = await resp.json().catch(() => ({}));
              lastError = errJson.error?.message || `${resp.status} ${resp.statusText}`;
            }
          } catch (e) {
            lastError = e.message || 'Network error';
          }
        }

        document.getElementById(loadingId)?.remove();

        if (result) {
          const turnId = 'msg_' + Date.now();
          renderAssistantTurn(turnId, result.geminiText, result.claudePrompt);
          appendToHistory({
            id: turnId,
            user: text,
            gemini: result.geminiText,
            claude_prompt: result.claudePrompt
          });
        } else {
          renderError(`خطا در ارتباط با جمینای: ${lastError}`);
        }

      } catch (e) {
        document.getElementById(loadingId)?.remove();
        renderError('خطای برقراری ارتباط با اینترنت.');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    function renderUserMessage(text) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'flex justify-end';
      div.innerHTML = `
        <div class="max-w-2xl bg-emerald-950/40 border border-emerald-800/50 rounded-2xl rounded-tl-sm px-4 py-2.5 sm:py-3 text-emerald-100 text-xs sm:text-sm leading-relaxed whitespace-pre-wrap">
          ${escapeHtml(text)}
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function renderLoading() {
      const id = 'loading_' + Date.now();
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.id = id;
      div.className = 'flex justify-start';
      div.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl px-4 py-2.5 sm:py-3 text-slate-400 text-xs flex items-center gap-2">
          <div class="w-3.5 h-3.5 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
          <span>جمینای در حال تحلیل و آماده‌سازی پرامپت کلود...</span>
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return id;
    }

    function renderError(msg) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'flex justify-start';
      div.innerHTML = `
        <div class="max-w-2xl bg-rose-950/30 border border-rose-800/50 rounded-2xl p-4 text-rose-300 text-xs space-y-2">
          <div class="font-bold flex items-center gap-1.5">⚠️ ${escapeHtml(msg)}</div>
          <button onclick="openSettingsModal()" class="text-xs text-rose-400 underline">بررسی تنظیمات API</button>
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function renderAssistantTurn(id, geminiText, claudePrompt, claudeResponse) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'flex justify-start w-full';

      const parsedGemini = marked.parse(geminiText || '');

      let promptBoxHtml = '';
      if (claudePrompt) {
        promptBoxHtml = `
          <!-- Dedicated Card: Claude Ready Prompt -->
          <div class="mt-3 sm:mt-4 pt-3 border-t border-slate-800">
            <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-3 space-y-2">
              
              <div class="flex items-center justify-between text-xs">
                <span class="font-bold text-emerald-400 flex items-center gap-1">
                  <span>🚀 پرامپت آماده برای Claude</span>
                </span>
                
                <div class="flex items-center gap-1.5">
                  <button id="copyBtn_${id}" onclick="copyPrompt('${id}')" class="px-2.5 sm:px-3 py-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white rounded-lg font-bold text-[11px] flex items-center gap-1 transition">
                    <span>📋 کپی برای Claude</span>
                  </button>
                  <button id="sendClaudeBtn_${id}" onclick="sendDirectToClaude('${id}')" class="px-2.5 sm:px-3 py-1 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 rounded-lg font-medium text-[11px] border border-slate-700 flex items-center gap-1 transition">
                    <span>🚀 ارسال مستقیم</span>
                  </button>
                </div>
              </div>

              <textarea id="promptText_${id}" readonly class="w-full h-24 sm:h-28 bg-slate-900 border border-slate-800/60 rounded-lg p-2 sm:p-2.5 text-[11px] font-mono text-emerald-300 resize-none ltr-box focus:outline-none">${escapeHtml(claudePrompt)}</textarea>

              <!-- Claude Direct Response Box -->
              <div id="claudeBox_${id}" class="${claudeResponse ? '' : 'hidden'} mt-2 pt-2 border-t border-slate-800/60">
                <div class="text-[11px] font-bold text-[#cc785c] mb-1">پاسخ دریافتی از Claude:</div>
                <div id="claudeContent_${id}" class="prose text-xs text-slate-300 bg-slate-900/60 border border-slate-800 p-3 rounded-lg max-w-none">
                  ${claudeResponse ? marked.parse(claudeResponse) : ''}
                </div>
              </div>

            </div>
          </div>
        `;
      }

      div.innerHTML = `
        <div class="w-full max-w-3xl bg-slate-900/70 border border-slate-800/90 rounded-2xl p-4 sm:p-5 text-slate-200 shadow-sm space-y-2">
          <div class="prose text-xs leading-relaxed max-w-none text-slate-200">
            ${parsedGemini}
          </div>
          ${promptBoxHtml}
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function copyPrompt(id) {
      const textarea = document.getElementById(`promptText_${id}`);
      if (!textarea) return;
      navigator.clipboard.writeText(textarea.value);
      const btn = document.getElementById(`copyBtn_${id}`);
      const oldHtml = btn.innerHTML;
      btn.innerHTML = '<span>✅ کپی شد!</span>';
      setTimeout(() => { btn.innerHTML = oldHtml; }, 2000);
    }

    // Direct Claude execution via Browser (optional)
    async function sendDirectToClaude(id) {
      const textarea = document.getElementById(`promptText_${id}`);
      if (!textarea) return;
      const prompt = textarea.value.trim();

      const anthropicKey = localStorage.getItem('pm_anthropic_key') || '';
      const claudeModel = localStorage.getItem('pm_claude_model') || 'claude-3-5-sonnet-20241022';

      if (!anthropicKey) {
        alert('برای استفاده از دکمه ارسال مستقیم، لطفاً ابتدا کلید Anthropic API Key را در بخش تنظیمات وارد کنید. یا می‌توانید به سادگی دکمه «کپی برای Claude» را بزنید و در کلود پیست کنید.');
        openSettingsModal();
        return;
      }

      const btn = document.getElementById(`sendClaudeBtn_${id}`);
      const claudeBox = document.getElementById(`claudeBox_${id}`);
      const claudeContent = document.getElementById(`claudeContent_${id}`);

      btn.disabled = true;
      btn.innerHTML = '<span>⏳ ارسال...</span>';
      claudeBox.classList.remove('hidden');
      claudeContent.innerHTML = '<span class="text-slate-400 text-xs">در حال دریافت پاسخ از کلود...</span>';

      try {
        const resp = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'x-api-key': anthropicKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
            'content-type': 'application/json'
          },
          body: JSON.stringify({
            model: claudeModel,
            max_tokens: 1500,
            system: "You are an elite Product Management Copilot. Deliver ultra-dense, actionable outputs in markdown tables or bullet points. Avoid polite conversational filler.",
            messages: [{ role: "user", content: prompt }]
          })
        });

        if (resp.ok) {
          const data = await resp.json();
          const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
          claudeContent.innerHTML = marked.parse(textBlocks);
          btn.innerHTML = '<span>✅ پاسخ آمد</span>';
          
          // update local history
          const history = getStoredHistory();
          const item = history.find(h => h.id === id);
          if (item) {
            item.claude_response = textBlocks;
            localStorage.setItem('pm_chat_history', JSON.stringify(history));
          }
        } else {
          const err = await resp.json().catch(() => ({}));
          claudeContent.innerHTML = `<span class="text-rose-400 font-bold">خطای Claude: ${escapeHtml(err.error?.message || resp.statusText)}</span>`;
          btn.innerHTML = '<span>❌ خطا</span>';
        }
      } catch (e) {
        claudeContent.innerHTML = `<span class="text-rose-400 font-bold">خطا: ${escapeHtml(e.message)}</span>`;
        btn.innerHTML = '<span>❌ خطا</span>';
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = '<span>🚀 ارسال مجدد</span>';
        }, 3000);
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
